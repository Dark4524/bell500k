name: Multi Social Dry Run

on:
  push:
    paths:
      - "social_auto/**"
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate common social queue
        run: python social_auto/dispatcher.py --mode dry-run
