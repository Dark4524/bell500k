name: X Automation Report

on:
  push:
    paths:
      - "x_auto/queue.json"
  schedule:
    - cron: "10 12 * * *" # 21:10 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build report
        run: python x_auto/x_report.py

      - name: Save report
        shell: bash
        run: |
          if git diff --quiet -- x_auto/report.json && git ls-files --error-unmatch x_auto/report.json >/dev/null 2>&1; then
            echo "No report change."
            exit 0
          fi
          git config user.name "bell-x-bot"
          git config user.email "bell-x-bot@users.noreply.github.com"
          git add x_auto/report.json
          git commit -m "Update X automation report"
          git push
